name: XBOX X/S Release with DebugInfo build

on:
  workflow_dispatch:

jobs:
  build_xbox_release_debuginfo:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        
      - name: Install GDK for Windows 10
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/microsoft/GDK/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match '^GDK_.*\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "No GDK ZIP found in the latest Microsoft/GDK release." }

          $downloadDir = Join-Path $env:RUNNER_TEMP "gdk"
          $archive = Join-Path $downloadDir $asset.name
          $extractDir = Join-Path $downloadDir "extracted"
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $extractDir -Force

          $installer = Get-ChildItem -Path $extractDir -Filter "PGDK.exe" -File -Recurse |
            Select-Object -First 1
          if (-not $installer) { throw "PGDK.exe was not found in the GDK archive." }

          $process = Start-Process -FilePath $installer.FullName `
            -ArgumentList "/quiet", "/norestart" -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "GDK installation failed with exit code $($process.ExitCode)."
          }
          
      - name: Python Dependency Installation
        shell: cmd
        run: python -m pip install -r "${{ github.workspace }}\tools\ci_build\github\windows\python\requirements.txt"
    
      - name: Locate vcvarsall and Setup Env
        uses: ./.github/actions/locate-vcvarsall-and-setup-env
        with:
          architecture: x64

      - name: Setup VCPKG Cache
        uses: ./.github/actions/setup-vcpkg-cache
        with:
          key: xbox-build-relwithdebinfo
          path: ${{ runner.temp }}/vcpkg-binary-cache

      - name: Build
        shell: cmd
        run: |
          .\build.bat --update --build `
            --config RelWithDebInfo `
            --build_dir "${{ github.workspace }}\build"
            --build_shared_lib `
            --cmake_generator "Visual Studio 17 2022" `
            --use_vcpkg --use_vcpkg_ms_internal_asset_cache `
            --skip_submodule_sync --skip_pip_install --skip_tests `
            --use_gdk `
            --use_dml --dml_path "C:\Program Files (x86)\Windows Kits\10\Include\10.0.19041.0\um" `
            --enable_wcos `
            --enable_dx_interop `
            --enable_msvc_static_runtime `
            --client_package_build `
            --disable_memleak_checker

    env:
      OrtPackageId: Microsoft.ML.OnnxRuntime
      OnnxRuntimeBuildDirectory: ${{ github.workspace }}\build
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
